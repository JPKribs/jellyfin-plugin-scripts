<div id="ScriptsSettingsPage" data-role="page"
     class="page type-interior pluginConfigurationPage withTabs"
     data-require="emby-input,emby-button,emby-select,emby-checkbox"
     data-controller="__plugin/scripts_settings.js">
    <div data-role="content">
        <div class="content-primary">
            <form id="ScriptsSettingsForm">
                <div class="verticalSection verticalSection-extrabottompadding">

                    <!-- Page title -->
                    <div class="sectionTitleContainer flex align-items-center">
                        <h1 class="sectionTitle" data-str="Settings">Settings</h1>
                    </div>

                    <!-- Runs -->
                    <!-- How many scripts run at once, and how long a command may take. -->
                    <div class="base-section">
                        <div class="base-section-title" data-str="LabelRuns">Runs</div>
                        <div class="base-section-content">
                            <div class="base-field">
                                <label data-str="LabelRunsAtOnce">Runs at once</label>
                                <div id="maxConcurrentRunsMount"></div>
                                <div class="fieldDescription" data-str="HelpRunsAtOnce">Sets how many scripts may run at the same time. Further runs wait their turn.</div>
                            </div>
                            <div class="base-field">
                                <label data-str="LabelDefaultTimeout">Default command timeout</label>
                                <div id="defaultTimeoutMount"></div>
                                <div class="fieldDescription" data-str="HelpDefaultTimeout">Stops a command step that sets no timeout of its own after this long.</div>
                            </div>
                        </div>
                    </div>

                    <!-- History -->
                    <!-- How many runs the History tab keeps. -->
                    <div class="base-section">
                        <div class="base-section-title" data-str="TabHistory">History</div>
                        <div class="base-section-content">
                            <div class="base-field">
                                <label data-str="LabelHistorySize">Runs kept</label>
                                <div id="historySizeMount"></div>
                                <div class="fieldDescription" data-str="HelpHistorySize">Drops the oldest runs past this many. 0 keeps none.</div>
                            </div>
                        </div>
                    </div>

                    <div id="saveBarMount"></div>

                </div>
            </form>
        </div>
    </div>

    <link rel="stylesheet" href="configurationpage?name=scripts_jpkribs_shared.css">
    <link rel="stylesheet" href="configurationpage?name=scripts_shared.css">
</div>
