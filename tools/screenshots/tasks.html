<!doctype html><html dir="ltr" class="layout-desktop"><head><meta charset="utf-8"><title>Scheduled Tasks mimic</title>
<!--STYLESHEETS:INDEX-->
<style>
/* The Scripts group of Dashboard, Scheduled Tasks, drawn as the dashboard draws one task row. */
body { margin: 0; background: #101010; }
.wrap { padding: 8px 15px; }
h2 { font-size: 20px; font-weight: 400; margin: 6px 0 10px; color: rgba(255,255,255,.87); }
.task { display: flex; align-items: center; background: #202020; border-radius: 4px; padding: 14px 16px; height: 44px; }
.task .icon { width: 40px; height: 40px; border-radius: 50%; background: #00a4dc; display: flex; align-items: center; justify-content: center; margin-right: 16px; }
.task .icon .material-icons { color: #fff; font-size: 22px; }
.task .name { flex: 1; font-size: 15px; color: rgba(255,255,255,.87); }
.task .sub { font-size: 13px; color: rgba(255,255,255,.6); }
.task .play { color: #fff; font-size: 26px; }
</style></head><body><div class="wrap"><h2>Scripts</h2>
<div class="task"><span class="icon"><span class="material-icons">schedule</span></span><div class="name">Nightly scan<div class="sub">Scans every library at 3:00.</div></div><span class="material-icons play">play_arrow</span></div>
</div><script>window.__errs = []; window.__ready = true;</script></body></html>
